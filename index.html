<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>A-DISK · 0.1.1</title>
  <style>
    :root{--red:#c41621;--red-deep:#9d101b;--ink:#303238;--line:#dddfe3}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    body{background:#f2f3f5;overflow-x:hidden}
    .shell{min-height:100svh;background:#f4f5f7}
    .shell:before,.shell:after{display:none}
    .header{height:60px;display:flex;align-items:center;gap:17px;padding:0 clamp(16px,2.8vw,38px);color:white;background:#c41621;border-bottom:1px solid #a40f19;box-shadow:0 2px 5px #0002;position:sticky;top:0;z-index:2}
    .menu-button{appearance:none;border:0;background:transparent;color:inherit;padding:7px 12px 7px 0;cursor:pointer;display:grid;place-items:center;border-right:1px solid #ffffff55;min-width:39px;height:37px}
    .menu-button svg{height:24px;width:24px;stroke-width:2.2}
    .brand{font-size:24px;font-weight:750;letter-spacing:-.6px;white-space:nowrap;line-height:1}
    .brand span{color:white}
    .logo{margin-left:auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-style:italic;font-size:22px;letter-spacing:-1px;font-weight:600;line-height:.9}
    .logo:before,.logo:after{content:"";width:88%;height:2px;background:white;transform:skewY(-7deg);margin-bottom:4px}.logo:after{margin:4px 0 0;transform:skewY(6deg)}
    main{max-width:1160px;margin:0 auto;padding:38px 25px 65px}
    .tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;align-items:stretch}
    .tile{display:flex;align-items:center;flex-direction:column;min-width:0;min-height:148px;justify-content:center;padding:19px 10px 15px;border:1px solid #d9dce1;border-radius:13px;background:#fff;box-shadow:0 2px 6px #00000012;color:#333;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
    .tile:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--red)}
    .tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px #0002;border-color:#bbbec4;outline:2px solid #c41621;outline-offset:2px}
    .tile-icon{height:67px;width:100%;display:grid;place-items:center;padding:0}
    .tile-icon svg{width:54px;height:54px;stroke:#bd1823;fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:2.25}
    .tile-name{height:auto;min-height:35px;width:100%;background:none;clip-path:none;display:flex;align-items:center;justify-content:center;padding:5px 2px 0;font-size:17px;line-height:1.16;font-weight:700;text-shadow:none;color:#333}
    .tile-icon rect[fill]{fill:#c41621}
    .overlay{position:fixed;inset:0;background:#0008;display:none;z-index:4}.overlay.active{display:block}
    .drawer{position:fixed;z-index:5;top:0;bottom:0;left:0;width:min(340px,88vw);background:#fafbfc;transform:translateX(-102%);transition:transform .2s ease;box-shadow:5px 0 20px #0002;padding:22px}
    .drawer.active{transform:translateX(0)}.drawer h2{margin:12px 0 20px}.drawer button{width:100%;border:0;background:#fff;border-bottom:1px solid #ddd;text-align:left;padding:16px 12px;font:inherit;cursor:pointer}.drawer button:hover{background:#f7e5e7}
    .version{font-size:12px;color:#777;position:absolute;bottom:24px}
    dialog{border:0;border-radius:14px;box-shadow:0 24px 80px #0006;padding:0;width:min(460px,calc(100vw - 32px));max-height:90vh;color:#25272d}dialog::backdrop{background:#0008}
    .dialog-header{padding:17px 22px;background:#c41621;color:white;font-size:20px;font-weight:700}.dialog-body{padding:22px 24px;font-size:16px;line-height:1.5}.dialog-body p{margin:0 0 16px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px}.btn{border:0;border-radius:8px;padding:12px 18px;background:#c41621;color:#fff;font:inherit;cursor:pointer}.btn.secondary{background:#e9ebef;color:#25272d}
    .note{font-size:12px;color:#85878b;margin-top:27px;text-align:left}
    @media(max-width:970px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:720px){main{padding:25px 16px 55px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.tile{min-height:126px;padding:14px 7px 9px}.tile-icon{height:55px}.tile-icon svg{width:44px;height:44px}.tile-name{font-size:15px}.header{height:54px;padding:0 14px}.brand{font-size:22px}.logo{font-size:19px}}
    @media(max-width:440px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:125px}.note{text-align:center}}
    @media(prefers-reduced-motion:reduce){.tile,.drawer{transition:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="header">
    <button class="menu-button" id="openMenu" aria-label="Otevřít nabídku" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 5h18M3 12h18M3 19h18"/></svg></button>
    <div class="brand"><span>A</span>-Disk</div>
    <div class="logo" aria-label="AVANTI">AVANTI</div>
  </header>
  <main>
    <div class="tiles" aria-label="Hlavní nabídka">
      <button class="tile" data-section="akce"><span class="tile-icon"><svg viewBox="0 0 64 64"><path d="M9 29 31 7h22a4 4 0 0 1 4 4v22L35 55a5 5 0 0 1-7 0L9 36a5 5 0 0 1 0-7Z"/><circle cx="45" cy="19" r="4"/><path d="m25 39 13-15M25 27h.01M38 39h.01" stroke-width="3" stroke-linecap="round"/></svg></span><span class="tile-name">Akce</span></button>
      <button class="tile" data-section="ceniky"><span class="tile-icon"><svg viewBox="0 0 64 64"><ellipse cx="22" cy="21" rx="15" ry="7"/><path d="M7 21v14c0 4 7 8 15 8 4 0 8-1 11-3M7 28c0 4 7 8 15 8"/><ellipse cx="43" cy="13" rx="14" ry="7"/><path d="M29 13v14c0 4 6 7 14 7s14-3 14-7V13M29 20c0 4 6 7 14 7s14-3 14-7"/><path d="M7 35v8c0 4 7 8 15 8s15-4 15-8v-8"/></svg></span><span class="tile-name">Ceníky</span></button>
      <button class="tile" data-section="technicke"><span class="tile-icon"><svg viewBox="0 0 64 64"><path d="M15 4h25l13 13v39a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z"/><path d="M40 4v14h13"/><rect x="13" y="31" width="44" height="19" rx="3" fill="#bc0014" stroke="white"/></svg></span><span class="tile-name">Technické<br>listy</span></button>
    </div>
    <p class="note" id="status" aria-live="polite">První verze · základní plocha · sekce dosud nejsou propojené</p>
  </main>
</div>
<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer" aria-label="Postranní nabídka"><h2>A-DISK</h2><button id="goHome">Úvodní obrazovka</button><button id="about">O aplikaci</button><span class="version">Verze 0.1.1 · pracovní prototyp</span></nav>
<dialog id="infoDialog"><div class="dialog-header" id="dialogTitle">A-DISK</div><div class="dialog-body" id="dialogText"></div><div class="dialog-actions"><button class="btn secondary" id="closeDialog">Zavřít</button><a id="openLink" class="btn" href="#" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:none">Otevřít odkaz</a></div></dialog>
<script>
  'use strict';
  // Pro případné napojení stačí doplnit cílové odkazy pro jednotlivé sekce.
  // Prázdný odkaz = zatím nenapojená sekce. V 0.1.1 nejsou žádné odkazy vymyšlené.
  const CONFIG = {
    version: '0.1.1',
    sections: {
      akce: {title:'Akce', url:''},
      ceniky: {title:'Ceníky', url:''},
      technicke: {title:'Technické listy', url:''}
    }
  };
  const $ = id => document.getElementById(id);
  const menu = $('drawer'), backdrop = $('overlay'), menuBtn = $('openMenu');
  function setMenu(open){ menu.classList.toggle('active',open); backdrop.classList.toggle('active',open); menuBtn.setAttribute('aria-expanded',String(open)); }
  function showDialog(title,html,url=''){
    $('dialogTitle').textContent=title;
    $('dialogText').innerHTML=html;
    const link=$('openLink');
    if(url && /^https:\/\//i.test(url)){link.href=url;link.style.display='inline-block';}else{link.style.display='none';link.removeAttribute('href');}
    $('infoDialog').showModal();
  }
  menuBtn.addEventListener('click',()=>setMenu(!menu.classList.contains('active')));
  backdrop.addEventListener('click',()=>setMenu(false));
  $('goHome').addEventListener('click',()=>setMenu(false));
  $('about').addEventListener('click',()=>{setMenu(false);showDialog('O aplikaci','<p>A-DISK 0.1.1 je první pracovní verze úvodní plochy.</p><p>Obsah Google Disku zatím není napojen. Aplikace nemění žádné soubory.</p>');});
  $('closeDialog').addEventListener('click',()=>$('infoDialog').close());
  document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{
    const section=CONFIG.sections[button.dataset.section];
    if(section.url){showDialog(section.title,'<p>Odkaz na tuto sekci je připraven. V první verzi se otevírá na Google Disku; vlastní prohlížení v A-DISKU bude předmětem dalšího kroku.</p>',section.url);}
    else {showDialog(section.title,'<p>Tato dlaždice je zatím součástí první grafické vrstvy.</p><p>Odkaz na odpovídající složku Google Disku ještě nebyl přiřazen.</p>');}
  }));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false);});
</script>
</body></html>
